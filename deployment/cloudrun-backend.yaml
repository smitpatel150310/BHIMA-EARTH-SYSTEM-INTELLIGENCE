apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: bhima-backend
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/description: "BHIMA Earth System Intelligence FastAPI Backend"
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "10"
        run.googleapis.com/cpu-throttling: "true"
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      serviceAccountName: bhima-cloudrun-sa@PROJECT_ID.iam.gserviceaccount.com
      containers:
        - image: us-central1-docker.pkg.dev/PROJECT_ID/bhima-registry/bhima-backend:latest
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "2"
              memory: "2Gi"
            requests:
              cpu: "1"
              memory: "1Gi"
          env:
            - name: ENVIRONMENT
              value: "production"
            - name: STORAGE_BACKEND
              value: "gcs"
            - name: BHIMA_GCS_BUCKET
              value: "bhima-observations-PROJECT_ID"
            - name: GCP_PROJECT_ID
              value: "PROJECT_ID"
            - name: CORS_ORIGINS
              value: "https://bhima.yourdomain.com,https://bhima-frontend-PROJECT_ID.a.run.app"
            - name: API_TIMEOUT_SECONDS
              value: "300"
          # Secret Manager integration for Gemini API key
          # env:
          #   - name: GEMINI_API_KEY
          #     valueFrom:
          #       secretKeyRef:
          #         name: bhima-gemini-api-key
          #         key: latest
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 15
            failureThreshold: 3
